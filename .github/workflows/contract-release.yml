name: contract-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Validate contract
        run: python3 tools/contract_ci.py check

      - name: Decide whether to publish
        id: decide
        run: |
          VERSION="$(cat contract/VERSION)"
          HASH="$(python3 tools/contract_ci.py hash)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          if git rev-parse "contract-v$VERSION" >/dev/null 2>&1; then
            OLD="$(python3 tools/contract_ci.py hash --rev "contract-v$VERSION")"
            if [ "$OLD" = "$HASH" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "contract $VERSION unchanged; nothing to publish"
            else
              echo "::error::contract/ changed but contract/VERSION is still $VERSION; bump it."
              exit 1
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build artifacts
        if: steps.decide.outputs.publish == 'true'
        run: |
          VERSION="${{ steps.decide.outputs.version }}"
          python3 tools/contract_ci.py zip "contract-v$VERSION.zip"
          python3 tools/contract_ci.py json "contract-v$VERSION.json"
          python3 tools/contract_ci.py release-notes notes.md
          cp "contract-v$VERSION.zip" contract-latest.zip
          python3 - "$VERSION" <<'PY'
          import json, sys
          from pathlib import Path
          version = sys.argv[1]
          data = json.loads(Path(f"contract-v{version}.json").read_text())
          data["channel"] = "latest"
          Path("contract-latest.json").write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Publish immutable release
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.decide.outputs.version }}"
          gh release create "contract-v$VERSION" \
            "contract-v$VERSION.zip" "contract-v$VERSION.json" \
            --title "Contract v$VERSION" \
            --notes-file notes.md

      - name: Update rolling latest release
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view contract-latest >/dev/null 2>&1; then
            gh release upload contract-latest contract-latest.zip contract-latest.json --clobber
          else
            gh release create contract-latest contract-latest.zip contract-latest.json \
              --title "Contract latest" \
              --notes "Rolling latest contract. Pin contract-vX.Y.Z for reproducibility." \
              --prerelease
          fi
