name: large-file-guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block large or generated files
        run: |
          git diff --name-only --diff-filter=A "${{ github.event.pull_request.base.sha }}...HEAD" > added.txt
          fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            if [ "$size" -gt 20971520 ]; then
              echo "::error::$f is $((size / 1048576)) MB (limit 20 MB)"
              fail=1
            fi
            case "$f" in
              *.pdf|*.raw|*.op.raw|vendor/*|reference-cache/*)
                echo "::error::$f is a local-only/generated file and must not be committed"
                fail=1
                ;;
            esac
          done < added.txt
          exit "$fail"
