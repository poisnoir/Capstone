name: Task
description: A scoped unit of work for one team.
title: "[task] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Keep it small enough for one PR. If it changes an interface, use the
        **Contract change** template instead.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What must be true when this is done?
      placeholder: "The DDS produces 8 tones with integer-J frames and passes the spectral test."
    validations:
      required: true
  - type: dropdown
    id: team
    attributes:
      label: Team
      options:
        - FPGA
        - Hardware
        - Robot arm
        - Integration
    validations:
      required: true
  - type: dropdown
    id: gate
    attributes:
      label: Gate
      options:
        - SC-0
        - FG-1
        - DRV-2
        - PEN-3
        - FE-4
        - ADC-5
        - DIG-6
        - INT-7
        - none
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance / test
      description: How will we know it is done? Link the evidence.
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links
      description: Contract IDs, docs, PRs, related issues.
    validations:
      required: false
