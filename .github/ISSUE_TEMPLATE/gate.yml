name: Gate
description: One stage-gate review (SC-0 … INT-7).
title: "[gate] "
labels: ["gate"]
body:
  - type: markdown
    attributes:
      value: |
        Copy the checklist from `docs/phase2/design_order.md` for this gate.
        Closing the issue is the sign-off; attach the evidence.
  - type: dropdown
    id: gate
    attributes:
      label: Gate
      options:
        - SC-0
        - FG-1
        - DRV-2
        - PEN-3
        - FE-4
        - ADC-5
        - DIG-6
        - INT-7
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      description: Who signs this gate?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Contract IDs covered
      description: SC-xx, decisions, ICD, RQ-Mx.
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Gate checklist
      description: Paste the design_order checklist; tick each item with evidence.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Links to measurements, reports, PRs, scope captures.
    validations:
      required: true
  - type: checkboxes
    id: signoff
    attributes:
      label: Sign-off
      options:
        - label: Owner sign-off
        - label: Integration sign-off
        - label: Affected teams notified
